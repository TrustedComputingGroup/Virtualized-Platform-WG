# Uncomment the following line if using openssl version less than 3.5
#oid_section = tcg_oids

[ ca ]
default_ca = ca_default

[ ca_default ]
new_certs_dir = ./ca/certs
database = ./ca/db
serial = ./ca/serial.txt
policy = generic_policy
copy_extensions   = copy
default_md = sha256
default_days = 3650
unique_subject = no

[ req ]
distinguished_name  = generic_policy

[ generic_policy ]
countryName = optional
stateOrProvinceName = optional
localityName = optional
organizationName = optional
organizationalUnitName = optional
commonName = optional
emailAddress = optional

[ alternate_names ]
DNS.1       = localhost
DNS.2       = localhost.localdomain
DNS.3       = 127.0.0.1

[ ca_extensions ]
keyUsage = critical,digitalSignature,nonRepudiation,keyEncipherment,keyCertSign
basicConstraints = critical,CA:true,pathlen:1
subjectKeyIdentifier = hash
authorityKeyIdentifier = keyid:always,issuer
basicConstraints = critical,CA:true
keyUsage = critical, digitalSignature, cRLSign, keyCertSign
authorityInfoAccess = caIssuers;URI:https://example.invalid/certs
crlDistributionPoints   = URI:https://example.invalid/crl
certificatePolicies = 2.16.840.1.101.3.1.48

[ server_extensions ]
keyUsage                = critical,digitalSignature,keyEncipherment
extendedKeyUsage        = serverAuth,clientAuth
subjectKeyIdentifier    = hash
authorityKeyIdentifier  = keyid:always
authorityInfoAccess     = caIssuers;URI:https://example.invalid/certs
crlDistributionPoints   = URI:https://example.invalid/crl
subjectAltName          = @alternate_names

[ signer_extensions ]
subjectKeyIdentifier = hash
authorityKeyIdentifier = keyid:always,issuer
keyUsage = critical, digitalSignature
authorityInfoAccess = caIssuers;URI:https://example.invalid/certs/
crlDistributionPoints   = URI:https://example.invalid/crl

[ tcg_oids ]
tcg-at-tpmManufacturer = 2.23.133.2.1
tcg-at-tpmModel = 2.23.133.2.2
tcg-at-tpmVersion = 2.23.133.2.3
tcg-kp-EKCertificate = 2.23.133.8.1
tcg-at-tpmSpecification  = 2.23.133.2.16
tcg-at-tpmSecurityAssertions = 2.23.133.2.18
tcg-kp-PlatformAttributeCertificate = 2.23.133.8.2

[ ek_extensions ]
keyUsage = critical,keyEncipherment
subjectKeyIdentifier = hash
authorityKeyIdentifier = keyid:always,issuer
authorityInfoAccess = caIssuers;URI:https://example.invalid/certs/
crlDistributionPoints   = URI:https://example.invalid/crl
basicConstraints = critical,CA:false
certificatePolicies = 2.16.840.1.101.3.1.48
extendedKeyUsage = tcg-kp-EKCertificate
subjectAltName = critical, @ek_alt_names
subjectDirectoryAttributes = ASN1:SEQUENCE:subj_dir_attributes_seq

[ ek_alt_names ]
dirName.1 =  tpm_manufacturer_seq

[ tpm_manufacturer_seq ]
tcg-at-tpmManufacturer = id:54535430
tcg-at-tpmModel = ABCDEF123456
tcg-at-tpmVersion = id:01

[ subj_dir_attributes_seq ]
tPMSpecification = SEQUENCE:tpm_spec_attr
tPMSecurityAssertions = SEQUENCE:tpm_security_assertions_attr

[ tpm_spec_attr ]
id = OID:tcg-at-tpmSpecification
tpm_spec_seq = SET:tpm_spec_seq

[ tpm_spec_seq ]
field4 = SEQUENCE:tpm_spec

[ tpm_spec ]
family = UTF8String:2.0
level = INTEGER:0
revision = INTEGER:99

[ tpm_security_assertions_attr ]
id = OID:tcg-at-tpmSecurityAssertions
tpm_security_assertions_seq = SET:tpm_security_assertions_seq

[ tpm_security_assertions_seq ]
tpm_security_assertions = SEQUENCE:tpm_security_assertions

# Although TPM profile spec indicates IMPLICIT fields be used,
# SubjectDirectoryAttributes AttributeValue type of ANY forces
# EXPLICIT tagging. Openssl does not enforce this by default.
[ tpm_security_assertions ]
version = INTEGER:0
fieldUpgradable = BOOLEAN:FALSE
ekGenerationType = IMPLICIT:0,ENUMERATED:1
ekGenerationLocation = IMPLICIT:1,ENUMERATED:0
ekCertificateGenerationLocation = IMPLICIT:2,ENUMERATED:2
ccInfo = IMPLICIT:3,SEQUENCE:common_criteria_measures
fipsLevel = IMPLICIT:4,SEQUENCE:fips_level
iso9000Certified = IMPLICIT:5,BOOLEAN:TRUE
iso9000Uri = IA5STRING:https://example.invalid/iso9000-cert

[ common_criteria_measures ]
version = IA5STRING:3.1
assuranceLevel = ENUMERATED:1
evaluationStatus = ENUMERATED:0
plus = BOOLEAN:FALSE
strengthOfFunction = IMPLICIT:0,ENUMERATED:1
profileOid = IMPLICIT:1,OID:tcg-kp-PlatformAttributeCertificate
profileUri = IMPLICIT:2,SEQUENCE:URIReference
targetOid = IMPLICIT:3,OID:tcg-kp-PlatformAttributeCertificate
targetUri = IMPLICIT:4,SEQUENCE:URIReference

[ URIReference ]
uniformResourceIdentifier = IA5STRING:https://example.invalid/cc-uri
hashAlgorithm = SEQUENCE:AlgorithmIdentifier
hashValue = BITSTRING:00112233445566778899AABBCCDDEEFF00112233445566778899AABBCCDDEEFF

[ AlgorithmIdentifier ]
algorithm = OID:1.2.840.113549.1.1.1
parameters = NULL

[ fips_level ]
version = IA5STRING:140-2
level = ENUMERATED:1
plus = BOOLEAN:FALSE
